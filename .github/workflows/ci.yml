name: Test and security gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml verify
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
  build-and-scan:
    needs: [backend-test, frontend-test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t taskflow-backend:ci backend
      - run: docker build -t taskflow-frontend:ci frontend
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow-backend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Start stack and smoke test through frontend proxy
        shell: bash
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 24)" > .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl --fail http://localhost:3000/api/tasks; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v
